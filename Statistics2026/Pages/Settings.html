<div data-role="page" class="page type-interior pluginConfigurationPage withTabs"
     data-require="emby-button,emby-select,emby-checkbox,emby-linkbutton"
     data-controller="__plugin/Settings.js">
    <div data-role="content">
        <div class="content-primary" style="padding-top:2px;">
            <h2 style="margin-top: 0px;margin-bottom: 0px;">Codec Information Settings</h2>

            <p>
                <h3 style="margin-top: 10px;">User Settings</h3>
                <label class="emby-checkbox-label">
                    <input style="margin-top: 10px;" id="excludeAdmin" is="emby-checkbox" class="emby-checkbox" type="checkbox">
                    <span class="checkboxLabel">Exclude Administrator users from reports?</span>
                    <i class="md-icon" id="excludeAdminHelp">info</i>
                </label>
                <label class="emby-checkbox-label">
                    <input style="margin-top: 10px;" id="hasConnectUserID" is="emby-checkbox" class="emby-checkbox" type="checkbox">
                    <span class="checkboxLabel">Only Show Users with Connect User ID?</span>
                    <i class="md-icon" id="hasConnectUserIDHelp">info</i>
                </label>
                Number of Most Active Users to Show:
                <i class="md-icon" id="numMostActiveHelp">info</i>
                <input type="number" id="numMostActive" min="1" max="1000" placeholder="# of Most Active" title="Number of Most Active" />
            </p>

            <p>
                <h3 style="margin-top: 10px;">Codec Settings</h3>
                <label class="emby-checkbox-label">
                    <input style="margin-top: 10px;" id="showAllCodecs" is="emby-checkbox" class="emby-checkbox" type="checkbox">
                    <span class="checkboxLabel">Show all Codecs?</span>
                    <i class="md-icon" id="showAllCodecsHelp">info</i>
                </label>
            </p>
            <p>
                <h3 style="margin-top: 10px;">Dolby Vision Profile Settings</h3>
                <label class="emby-checkbox-label">
                    <input style="margin-top: 10px;" id="showUnknownDVProfiles" is="emby-checkbox" class="emby-checkbox" type="checkbox">
                    <span class="checkboxLabel">Show non-HEVC/Unknown Dolby Vision profiles?</span>
                    <i class="md-icon" id="showUnknownDVProfilesHelp">info</i>
                </label>
                <label class="emby-checkbox-label">
                    <input style="margin-top: 10px;" id="showAllDVProfiles" is="emby-checkbox" class="emby-checkbox" type="checkbox">
                    <span class="checkboxLabel">Show all Dolby Vision profiles?</span>
                    <i class="md-icon" id="showAllDVProfilesHelp">info</i>
                </label>
            </p>
            <p>
                <h3 style="margin-top: 10px;">Resolution Settings</h3>
                <label class="emby-checkbox-label">
                    <input style="margin-top: 10px;" id="showAllResolutions" is="emby-checkbox" class="emby-checkbox" type="checkbox">
                    <span class="checkboxLabel">Show all Resolutions?</span>
                    <i class="md-icon" id="showAllResolutionsHelp">info</i>
                </label>
            </p>
        </div>
    </div>
</div>
