<div data-role="page" data-id="summary_page" class="page type-interior pluginConfigurationPage withTabs"
     data-require="emby-button,emby-select,emby-checkbox,emby-linkbutton"
     data-controller="__plugin/Summary.js">
<!--    <link rel="stylesheet" href="__plugin/styles.css" />-->
    <div data-role="content">
        <div class="content-primary" style="padding-top:2px;">
            <p name="pageIntro" id="pageIntro" />
            <p name="lastRunInfo" id="lastRunInfo" />
            <p name="debugInfo" id="debugInfo" />

            <h2 style="margin-top: 0px;margin-bottom: 0px;">User Information</h2>
            <div class="statRow" name="userInfo" id="userInfo"></div>
            <div class="statRow" name="playedUserMedia" id="playedUserMedia"></div>
            <div class="statRow" name="userWatchMediaIssues" id="userWatchMediaIssues"></div>

            <h2 style="margin-top: 0px;margin-bottom: 0px;">Media Information</h2>
            <div class="statRow" name="mediaInfo" id="mediaInfo"></div>

            <h2 style="margin-top: 0px;margin-bottom: 0px;">Movie Statistics</h2>
            <div class="statRow" name="movieStats_totals" id="movieStats_totals"></div>
            <div class="statRow" name="movieStats_size" id="movieStats_size"></div>
            <div class="statRow" name="movieStats_ratings" id="movieStats_ratings"></div>
            <div class="statRow" name="movieStats_video_quality" id="movieStats_video_quality"></div>
            <div class="statRow" name="movieStats_added_to_server" id="movieStats_added_to_server"></div>
            <div class="statRow" name="movieStats_age_stats" id="movieStats_age_stats"></div>
            <div class="statRow" name="movieStats_mostLeastWatched" id="movieStats_mostLeastWatched"></div>

            <h2 style="margin-top: 0px;margin-bottom: 0px;">TV Episode & Series Statistics</h2>

            <div class="statRow" name="seriesStats_totals" id="seriesStats_totals"></div>
            <div class="statRow" name="seriesStats_size" id="seriesStats_size"></div>
            <div class="statRow" name="seriesStats_ratings" id="seriesStats_ratings"></div>
            <div class="statRow" name="seriesStats_video_quality" id="seriesStats_video_quality"></div>
            <div class="statRow" name="seriesStats_added_to_server" id="seriesStats_added_to_server"></div>
            <div class="statRow" name="seriesStats_age_stats" id="seriesStats_age_stats"></div>
            <div class="statRow" name="seriesStats_mostLeastWatched" id="seriesStats_mostLeastWatched"></div>

            <div class="statRow" name="episodeStats_age_stats" id="episodeStats_age_stats"></div>
            <div class="statRow" name="episodeStats_added_to_server" id="episodeStats_added_to_server"></div>
        </div>
    </div>
</div>
