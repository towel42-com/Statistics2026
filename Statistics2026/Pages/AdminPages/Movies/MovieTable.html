<div data-role="page" class="page type-interior pluginConfigurationPage withTabs"
     data-require="emby-button,emby-select,emby-checkbox,emby-linkbutton"
     data-controller="__plugin/Statistics2026_Pages_AdminPages_Movies_MovieTable.js">
    <div data-role="content">
		<div class="content-primary" style="padding-top:2px;">
			<h2 style="margin-top: 0px;margin-bottom: 0px;">Movies Information</h2>

			<div class="radioButtonsContainer" style="display: flex; flex-direction: row; gap: 24px; align-items: center; margin-top: 15px; margin-bottom: 15px;">
				<label class="radioContainer">
					<input name="movieDisplay" is="emby-radio" type="radio" value="OnServer" checked />
					<span>Show Movies on Server?</span>
				</label>

				<label class="radioContainer">
					<input name="movieDisplay" is="emby-radio" type="radio" value="Missing" />
					<span>Show Missing Movies?</span>
				</label>

				<label class="radioContainer">
					<input name="movieDisplay" is="emby-radio" type="radio" value="All" />
					<span>Show All?</span>
				</label>
			</div>

			<p name="lastRunInfo" id="lastRunInfo" />

			<div id="movie_results_table" style="width:95%; margin-bottom: 100px;"></div>
		</div>
    </div>
</div>
