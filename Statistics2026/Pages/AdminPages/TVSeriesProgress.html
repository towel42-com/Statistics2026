<div data-role="page" class="page type-interior pluginConfigurationPage withTabs"
     data-require="emby-button,emby-select,emby-checkbox,emby-linkbutton"
     data-controller="__plugin/TVSeriesProgress.js">
    <div data-role="content">
        <div class="content-primary" style="padding-top:2px;">
            <h1>TV Series Progress Per User</h1>
            <p name="lastRunInfo" id="lastRunInfo" />

            <div style="max-width: 900px;">
                <div class="selectContainer">
                    <label class="selectLabel selectLabelUnfocused" for="selectUser_tvprogress">Load TV Series Progress for:</label>
                    <div class="emby-select-wrapper emby-select-wrapper-smaller">
                        <select is="emby-select" id="selectUser_tvprogress" label="Load TV Series Progress for:" class="emby-select-backdropfilter emby-select"></select>
                        <div class="selectArrowContainer">
                            <div style="visibility: hidden;">0</div>
                            <i class="md-icon selectArrow"></i>
                        </div>
                    </div>
                </div>

                <h2 id="UserTitle"></h2>

                <div id="TVSeriesProgress_status">Loading Data...</div>

                <table class="sortable-table-styled" cellpadding="6" id="TVSeriesProgress_table" style="width:95%;">
                    <thead id="TVSeriesProgress_head"></thead>
                    <tbody class="resultBody" id="TVSeriesProgress_body"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
