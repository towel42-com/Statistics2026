<div data-role="page" class="page type-interior pluginConfigurationPage withTabs"
     data-require="emby-button,emby-select,emby-checkbox,emby-linkbutton"
     data-controller="__plugin/Stats2026_SystemSettings.js">
    <div data-role="content">
        <div class="content-primary" style="padding-top:2px;">
            <h2 style="margin-top: 0px;margin-bottom: 0px;">Analysis Settings</h2>

            <h3 style="margin-top: 10px;">System Settings</h3>
            <div class="inputContainer">
                <label class="emby-checkbox-label">
                    <input style="margin-top: 10px;" id="showDebugInfo" is="emby-checkbox" class="emby-checkbox" type="checkbox">
                    <span class="checkboxLabel">Show debug info?</span>
                    <i class="md-icon" id="showDebugInfoHelp">info</i>
                </label>
            </div>

            <div class="inputContainer">
                <label class="emby-checkbox-label">
                    <input style="margin-top: 10px;" id="showDiagnosticInfo" is="emby-checkbox" class="emby-checkbox" type="checkbox">
                    <span class="checkboxLabel">Show diagnostic info?</span>
                    <i class="md-icon" id="showDiagnosticInfoHelp">info</i>
                </label>
            </div>

            <div class="inputContainer">
                <label class="emby-checkbox-label">
                    <input style="margin-top: 10px;" id="showLastRunInfo" is="emby-checkbox" class="emby-checkbox" type="checkbox">
                    <span class="checkboxLabel">Show last run info?</span>
                    <i class="md-icon" id="showLastRunInfoHelp">info</i>
                </label>
            </div>
            <div class="inputContainer">
                <label class="emby-checkbox-label">
                    <input style="margin-top: 10px;" id="resetPlayCount" is="emby-checkbox" class="emby-checkbox" type="checkbox">
                    <span class="checkboxLabel">Reset play count/time?</span>
                    <i class="md-icon" id="resetPlayCountHelp">info</i>
                </label>
            </div>
            <div class="inputContainer">
                <label class="emby-checkbox-label">
                    <input style="margin-top: 10px;" id="resetDBState" is="emby-checkbox" class="emby-checkbox" type="checkbox">
                    <span class="checkboxLabel">Reset database state?</span>
                    <i class="md-icon" id="resetDBStateHelp">info</i>
                </label>
            </div>


            <h3 style="margin-top: 10px;">Dolby Vision Profile Report Settings</h3>
            <div class="inputContainer">
                <label class="emby-checkbox-label">
                    <input style="margin-top: 10px;" id="showUnknownDVProfiles" is="emby-checkbox" class="emby-checkbox" type="checkbox">
                    <span class="checkboxLabel">Show non-HEVC/Unknown Dolby Vision profiles?</span>
                    <i class="md-icon" id="showUnknownDVProfilesHelp">info</i>
                </label>
            </div>

            <h3 style="margin-top: 10px;">Resolution Report Settings</h3>
            <div class="inputContainer">
                <label class="emby-checkbox-label">
                    <input style="margin-top: 10px;" id="showAllResolutions" is="emby-checkbox" class="emby-checkbox" type="checkbox">
                    <span class="checkboxLabel">Show all Resolutions?</span>
                    <i class="md-icon" id="showAllResolutionsHelp">info</i>
                </label>
            </div>
        </div>
    </div>
</div>
