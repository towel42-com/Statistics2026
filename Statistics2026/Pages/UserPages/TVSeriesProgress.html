<div is="emby-scroller" class="view flex flex-direction-column scrollFrameY flex-grow pluginConfigurationPage withTabs"
     data-horizontal="false"
     data-forcescrollbar="true"
     data-centerfocus="true"
     data-bindheader="true"
     data-require="emby-button,emby-select,emby-checkbox,emby-linkbutton"
     data-controller="__plugin/TVSeriesProgress_UserPage.js"
     data-title="TVSeriesProgress_UserPage">
    <div class="scrollSlider flex-grow flex-direction-column padded-left padded-left-page padded-right padded-top-page padded-bottom-page">
        <div data-role="content">
            <div class="content-primary" style="padding-top:2px;">
                <h2 id="UserTitle"></h2>

                <div id="TVSeriesProgressStatus">Loading Data...</div>

                <table class="sortable-table-styled" cellpadding="6" id="TVSeriesProgressTable" style="width:95%;">
                    <thead>
                        <tr style="text-align: left; white-space: nowrap;">
                            <th data-column="Name" data-type="string" class="info_cell_heading">TV Series (Premiere Year)<span class="sort-icon"></span></th>
                            <th data-column="EpisodeProgess" data-type="string" class="info_cell_heading" style="white-space: nowrap;">Episodes<span class="sort-icon"></span><span class="infoBlock" id="episodesInfo"><i class="md-icon">info</i></span></th>
                            <th data-column="Score" data-type="number" class="info_cell_heading">Score<span class="sort-icon"></span></th>
                            <th data-column="Status" data-type="string" class="info_cell_heading">Series Status<span class="sort-icon"></span></th>
                        </tr>
                    </thead>
                    <tbody class="resultBody" id="TVSeriesProgressTable_results"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
