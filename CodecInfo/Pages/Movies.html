<div data-role="page" class="page type-interior pluginConfigurationPage withTabs"
	 data-require="emby-button,emby-select,emby-checkbox,emby-linkbutton"
	 data-controller="__plugin/Movies.js">
	<div data-role="content">
		<div class="content-primary" style="padding-top:2px;">
			<h2 style="margin-top: 0px;margin-bottom: 0px;">Codec Information for Movies</h2>

			<div id="movie_results_status">Loading Data...</div>

			<table cellpadding="6" id="movie_results_table" style="width:95%; padding-bottom: 250px;">
				<thead>
					<tr style="text-align: left;">
						<th class="detailTableHeaderCell" data-priority="1">Name</th>
						<th class="detailTableHeaderCell" data-priority="2">Release Year</th>
						<th class="detailTableHeaderCell" data-priority="3">Resolution</th>
						<th class="detailTableHeaderCell" data-priority="4">Codec</th>
						<th class="detailTableHeaderCell" data-priority="5">Dolby Vision Profile</th>
						<th class="detailTableHeaderCell" data-priority="6">Location on Server</th>
					</tr>
				</thead>
				<tbody class="resultBody" id="movie_results"></tbody>
			</table>

		</div>
	</div>
</div>
